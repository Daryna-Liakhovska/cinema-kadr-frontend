<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Профіль користувача кінотеатру «Кадр»." />
        <title>Мій профіль — Кінотеатр «Кадр»</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header class="header">
            <h1>Кінотеатр «Кадр»</h1>
            <nav id="nav" class="nav">
            </nav>
        </header>
        <main class="container narrow">
            <h2>Мій профіль</h2>
            <p id="profile-status" class="status">Завантаження...</p>
            <dl id="profile" class="profile">
            </dl>
            <section id="admin-panel" class="admin-panel" hidden>
                <h2>Адміністрування</h2>
                <p>Додати новий жанр:</p>
                <form id="genre-form" class="form inline-form" novalidate>
                    <input name="name" maxlength="100" placeholder="Назва жанру" required />
                    <button type="submit">Додати</button>
                </form>
                <p id="genre-status" class="status"></p>
            </section>
        </main>
        <script src="js/config.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/profile.js"></script>
    </body>
</html>
